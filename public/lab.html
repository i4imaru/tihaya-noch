l'insomnie, et il vaut la peine de consulter un médecin. Elle se soigne bien, le plus souvent sans médicaments, par la thérapie cognitivo-comportementale. Les conseils ci-dessus en sont tirés, mais un médecin les adaptera à votre cas.","breatheTitle":"Respiration 4-7-8","breatheLead":"Inspirez par le nez sur 4 temps, retenez votre souffle sur 7, expirez lentement par la bouche sur 8. Quatre cycles. Une longue expiration ralentit le pouls et aide le corps à passer au repos.","breatheStart":"Commencer","breatheStop":"Arrêter","breatheIn":"Inspirez","breatheHold":"Retenez","breatheOut":"Expirez","breatheRound":"Cycle {n} sur 4","breatheDone":"C'est bien. Vous pouvez maintenant entrer dans une pièce.","howTitle":"Comment ça marche","how":[{"t":"Choisissez une pièce","b":"Il y en a dix, toutes différentes. Bougez la souris ou inclinez votre téléphone, et la pièce pivote légèrement."},{"t":"Installez-vous","b":"Allumez la lampe, la pluie ou la télévision. Caressez le chat, et il se met à ronronner."},{"t":"Réglez la minuterie","b":"La pièce s'endort peu à peu : la télévision s'éteint, la lampe faiblit, le chat s'endort, le son s'efface, l'écran s'assombrit."}],"payTitle":"Payez si cela vous a plu","payLead":"Le site est gratuit et sans publicité. Si la nuit a été paisible, vous pouvez laisser un remerciement.","footer":"Nuit paisible. Pour ceux qui ne trouvent pas le sommeil.","notesTitle":"Et vous, comment vous endormez-vous","notesLead":"Voici les conseils des visiteurs du site, sans retouche. Si vous avez votre propre façon de trouver le sommeil, partagez-la : elle apparaîtra ici après relecture.","notesPh":"Qu'est-ce qui vous aide à dormir ? Par exemple après une journée difficile ou dans un endroit qui n'est pas le vôtre","notesSend":"Envoyer","notesSent":"Merci. Votre conseil apparaîtra ici dès que nous l'aurons lu.","notesEmpty":"Rien pour l'instant. Votre conseil pourrait être le premier.","notesFail":"L'envoi n'a pas abouti. Réessayez plus tard.","notesAnon":"un visiteur"},"scenes":{"room":{"title":"La chambre tranquille","tag":"Ex-URSS · rez-de-chaussée","place":"Ex-URSS","lamp":"Lampadaire","intro":"Un appartement au rez-de-chaussée. La lune entre par la porte du balcon, un lampadaire, un chat blanc sur le rebord de la fenêtre.","hint":"Touchez le chat ou caressez-le, et il se met à ronronner","sounds":""},"dacha":{"title":"La datcha","tag":"véranda · août","place":"Ex-URSS","lamp":"Abat-jour","intro":"Une véranda vitrée à la fin de l'été. Du thé dans un verre à monture de métal et de la confiture de cerises, un géranium sur le rebord de la fenêtre ; par la porte ouverte, on voit le jardin et la serre. Sur le seuil, un chat blanc.","hint":"Touchez le chat, et il se met à ronronner. Touchez l'abat-jour pour l'allumer","sounds":""},"ca":{"title":"La cour sous la treille","tag":"Asie centrale · été","place":"Asie centrale","lamp":"Lampe","intro":"Un tapchan, large lit de bois, sous la treille ; des matelas piqués, une théière et des bols sur un plateau, un portail bleu dans le mur en pisé. Sur le carrelage tiède, un chat blanc.","hint":"Touchez le chat, et il se met à ronronner. Touchez la lampe pour l'allumer","sounds":""},"korea":{"title":"L'appartement à Séoul","tag":"à flanc de colline · été","place":"Corée","lamp":"Lampe","intro":"Un appartement à flanc de colline. Un sol jaune et tiède, du thé d'orge sur une table basse, derrière le balcon les lumières du quartier. Par terre, un chat blanc.","hint":"Touchez le chat, et il se met à ronronner. Touchez la lampe pour l'allumer","sounds":""},"jp":{"title":"La maison japonaise","tag":"engawa · été","place":"Japon","lamp":"Lanterne andon","intro":"Les shōji, panneaux de papier coulissants, sont ouverts sur le jardin d'été : un étang aux nénuphars, une lanterne de pierre, des lucioles. Sur l'engawa, la véranda de bois, un chat blanc ; sous l'avant-toit pend un carillon furin.","hint":"Touchez le chat, et il se met à ronronner. Le carillon furin tinte quand on le touche","sounds":""},"china":{"title":"La chambre sur cour","tag":"Chine · été","place":"Chine","lamp":"Lampe de bureau","intro":"Une chambre qui ouvre sur une cour. Un ventilateur, un thermos et une tasse émaillée, une natte sur le lit, du linge qui sèche dans la cour. Sur le seuil, un chat blanc.","hint":"Touchez le chat, et il se met à ronronner. Touchez la lampe pour l'allumer","sounds":""},"sea":{"title":"La maison sur pilotis","tag":"Asie du Sud-Est","place":"Asie du Sud-Est","lamp":"Lanterne","intro":"Une maison en bois au bord des rizières. Une moustiquaire, une lanterne au mur, un verre de thé glacé ; derrière la rambarde, des lucioles sur l'eau et des palmiers. Sur le balcon, un chat blanc.","hint":"Touchez le chat, et il se met à ronronner. Touchez la lanterne pour l'éteindre","sounds":""},"india":{"title":"La véranda après la pluie","tag":"Inde · mousson","place":"Inde","lamp":"Lampe à pétrole","intro":"La véranda d'une maison de village après la pluie. Un charpai, lit de corde tressée, une lampe à pétrole sur un tabouret, un gobelet en acier rempli de chai, la cour mouillée et son puits sous la lune. Sur le carrelage, un chat blanc.","hint":"Touchez le chat, et il se met à ronronner. Touchez la lampe pour l'éteindre","sounds":""},"usa":{"title":"La chambre de banlieue","tag":"États-Unis","place":"États-Unis","lamp":"Lampe","intro":"Une chambre en banlieue. Des posters, une lampe à lave, un radiocassette, une tasse de chocolat chaud ; dehors, une pelouse et une cabane dans l'arbre. Sur le tapis, un chat blanc.","hint":"Touchez le chat, et il se met à ronronner. Touchez la lampe pour l'allumer","sounds":""},"latam":{"title":"La maison au patio","tag":"Amérique latine","place":"Amérique latine","lamp":"Lampe","intro":"Une vieille maison avec une porte en arc donnant sur le patio : un fauteuil à bascule, des rideaux de dentelle, une guirlande lumineuse au-dessus des fleurs, une tasse de café. Dans l'encadrement de la porte, un chat blanc.","hint":"Touchez le chat, et il se met à ronronner. Touchez la lampe pour l'allumer","sounds":""}}},"de":{"meta":{"lang":"de","name":"Deutsch","site":"Stille Nacht"},"ui":{"rooms":"Zimmer","prevRoom":"Vorheriges Zimmer","nextRoom":"Nächstes Zimmer","home":"Startseite","tv":"Fernseher","rain":"Regen","timer":"Einschlaf-Timer","breathe":"Atmung","sound":"Ton","close":"Schließen","loading":"Zimmer wird geladen…","wakeTap":"Tippen Sie, um aufzuwachen","sceneControls":"Szenensteuerung","sceneLabel":"Nachtzimmer","timerText":"Das Licht wird langsam schwächer, die Katze schläft ein, der Ton verklingt. Am Ende wird der Bildschirm schwarz.","timerTextOn":"Sie können eine andere Zeit wählen oder den Timer ausschalten.","timerOff":"Timer ausschalten","min":"{n} Min.","timerSet":"Timer auf {n} Min. Das Licht geht von selbst aus","timerCancelled":"Timer ausgeschaltet","cat":"Katze","furin":"Furin-Windspiel","pond":"Teich","puddle":"Pfütze","soundOn":"Ton an","soundOff":"Ton aus","morning":"Guten Morgen","morningText":"Sie sind um {time} in „{room}“ eingeschlafen.","payOwn":"Eigener Betrag","payNote":"So viel Sie möchten, oder gar nichts. Bezahlung über PayPal.","payNoteWake":"Wenn die Nacht ruhig war, können Sie ein kleines Dankeschön dalassen. So viel Sie möchten, oder nichts.","payThanks":"Danke. PayPal öffnet sich in einem neuen Tab.","backToRoom":"Zurück ins Zimmer","soundsLabel":"Zu hören:","fullscreen":"Vollbild","fsIos":"Für Vollbild: Teilen → Zum Home-Bildschirm","rainL0":"Regen aus","rainL1":"Leichter Regen","rainL2":"Mäßiger Regen","rainL3":"Starker Regen","radio":"Radiorekorder","radio0":"Radiorekorder aus","radio1":"Radio: Synthpop","radio2":"Radio: ruhige Ballade","fsTap":"Tippen Sie auf den Bildschirm für den Vollbildmodus"},"home":{"navRooms":"Zimmer","navTips":"Besser einschlafen","navBreathe":"Atmung","navAbout":"So funktioniert es","lang":"Sprache","heroLead":"Nächtliche Zimmer in verschiedenen Ecken der Welt. Schalten Sie die Lampe oder den Regen ein, streicheln Sie die weiße Katze und stellen Sie den Timer: Das Zimmer schläft mit Ihnen ein.","heroCta":"Zimmer betreten","heroCtaLast":"Zurück: {room}","heroNote":"Mit Ton. Am besten mit Kopfhörern.","roomsTitle":"Zimmer","roomsLead":"Zehn Zimmer, und vor jedem Fenster eine ganz eigene Nacht.","tipsTitle":"Was beim Einschlafen hilft","tipsLead":"Ein Wundermittel gibt es hier nicht. Es sind einfache Dinge, die Schlafexperten empfehlen. Sie müssen nicht alles auf einmal machen: Suchen Sie sich Ihre Situation heraus und probieren Sie einen Tipp mindestens eine Woche lang.","tips":[{"k":"Wenn Sie jeden Abend zu einer anderen Zeit ins Bett gehen","t":"Der Wecker am Morgen zählt mehr als die Uhrzeit fürs Zubettgehen","b":"Einschlafen lässt sich nicht erzwingen, zur selben Zeit aufstehen schon. Auch nach einer schlechten Nacht, auch am Samstag. Die erste Woche ist hart, tagsüber zieht es Sie aufs Sofa. Legen Sie sich lieber nicht hin: Bis zum Abend sammelt sich die Müdigkeit an, und Sie schlafen schneller ein. Meist hat sich der Körper nach zwei, drei Wochen daran gewöhnt."},{"k":"Wenn Sie sich länger als zwanzig Minuten hin und her wälzen","t":"Stehen Sie auf. Klingt seltsam, funktioniert aber","b":"Wer daliegt und sich ärgert, dass der Schlaf nicht kommt, verbindet das Bett bald mit Unruhe. Gehen Sie in die Küche, machen Sie ein kleines Licht an, blättern Sie in einem Buch oder einer alten Zeitschrift. Ohne Handy und ohne grelles Licht. Kommen Sie zurück, wenn Ihnen die Augen zufallen. Anfangs stehen Sie vielleicht zwei-, dreimal pro Nacht auf, später immer seltener."},{"k":"Wenn Ihnen der morgige Tag durch den Kopf geht","t":"Ein Zettel mit den Aufgaben neben dem Bett","b":"Nehmen Sie sich fünf Minuten vor dem Schlafen und schreiben Sie alles auf, was morgen ansteht, ordentlich als Liste oder einfach hingekritzelt. Was schon erledigt ist, gehört nicht dazu, nur das, was noch vor Ihnen liegt. In einem kleinen Experiment schliefen Menschen nach so einer Liste deutlich schneller ein. Was aufgeschrieben ist, darf bis morgen früh warten."},{"k":"Wenn Sie nachmittags noch Kaffee trinken","t":"Die letzte Tasse vor 14 Uhr","b":"Koffein wird langsam abgebaut: Nach fünf bis sechs Stunden ist noch etwa die Hälfte im Blut. Eine Tasse um 16 Uhr wirkt um 22 Uhr noch nach, auch wenn Sie das Gefühl haben, Kaffee macht Sie gar nicht mehr wach. Starker schwarzer und grüner Tee, Cola und Schokolade zählen übrigens mit."},{"k":"Wenn das Glas Wein zum Einschlafen zur Gewohnheit geworden ist","t":"Alkohol macht müde, weckt Sie aber um drei Uhr nachts","b":"Die ersten Stunden nach dem Wein schläft man tief. Dann baut der Körper den Alkohol ab, und der Schlaf wird unruhig: Ihnen ist warm, Sie haben Durst, Sie wachen auf und finden lange nicht zurück in den Schlaf. Wenn Sie ein Abendritual brauchen, versuchen Sie es mit warmer Milch oder Kräutertee. Dabei geht es weniger um das Getränk als um die warme Tasse in der Hand und die kleine Pause vor dem Schlafen."},{"k":"Wenn die Luft im Schlafzimmer stickig ist","t":"Ein kühles Zimmer und eine warme Decke","b":"Um einzuschlafen, muss der Körper ein wenig abkühlen. Am besten schläft man bei etwa 18–20 °C im Zimmer. Lüften Sie vor dem Schlafengehen, und damit Sie nicht frieren, nehmen Sie eine wärmere Decke oder ziehen Socken an. Warme Füße helfen übrigens auch beim Einschlafen."},{"k":"Wenn Sie abends lange am Handy hängen","t":"Eine Stunde vor dem Schlafen wärmeres, gedämpftes Licht","b":"Schalten Sie die Deckenlampe aus und lassen Sie nur eine Steh- oder Tischlampe mit warmweißem Licht an. Helles weißes Licht, vor allem von einem Bildschirm direkt vor dem Gesicht, sagt dem Gehirn, dass noch Tag ist. Wenn es ohne Handy nicht geht, drehen Sie die Helligkeit ganz herunter und schalten Sie den warmen Nachtmodus ein. Deshalb sind die Räume hier so dunkel, und der Timer schaltet den Bildschirm von selbst ab."},{"k":"Wenn der Körper müde ist, der Kopf aber nicht","t":"Eine warme Dusche, ein bis anderthalb Stunden vor dem Schlafen","b":"Kein heißes Bad direkt vor dem Zubettgehen, sondern eine warme Dusche mit etwas Abstand. Danach gibt die Haut Wärme ab, die Körpertemperatur sinkt, und das ist eines der Signale für den Schlaf. Das funktioniert gut zusammen mit einem kühlen Schlafzimmer."},{"k":"Wenn Sie mitten in der Nacht aufwachen","t":"Schauen Sie nicht auf die Uhr","b":"Sie sehen 3:47, und schon beginnt das Rechnen: noch drei Stunden bis zum Wecker, morgen die Besprechung, jetzt aber schnell einschlafen. Genau damit ist der Schlaf endgültig weg. Drehen Sie die Uhr zur Wand und legen Sie das Handy mit dem Display nach unten, ein Stück weg vom Bett."},{"k":"Wenn Nachbarn oder die Straße stören","t":"Ein gleichmäßiges Rauschen statt Stille","b":"In völliger Stille weckt einen jede zufallende Tür. Ein gleichmäßiges Geräusch, ob Regen oder Ventilator, glättet plötzlichen Lärm. Vielleicht hat man deshalb im Zug beim Rattern der Räder so gut geschlafen."},{"k":"Wenn Sie morgens nicht wach werden","t":"Morgens ans Licht, wenigstens zehn Minuten","b":"Gehen Sie mit dem Tee auf den Balkon, laufen Sie zu Fuß zur Haltestelle oder setzen Sie sich ans Fenster. Morgenlicht stellt die innere Uhr, und abends kommt die Müdigkeit zur richtigen Zeit statt um zwei Uhr nachts. Selbst an einem trüben Tag ist es draußen heller als in der Wohnung."},{"k":"Wenn das Herz rast und Sie nicht zur Ruhe kommen","t":"Atmen Sie länger aus als ein","b":"Wenn das Ausatmen länger dauert als das Einatmen, wird der Puls langsamer. Das ist Physiologie, keine Magie. Probieren Sie die 4-7-8-Atmung etwas weiter unten. Fällt es Ihnen schwer, die Luft bis sieben anzuhalten, atmen Sie zunächst auf 4 ein und auf 6 aus. Wird Ihnen leicht schwindlig, atmen Sie einfach ruhiger weiter."}],"tipsNote":"Wenn Sie seit mehr als drei Monaten in drei oder mehr Nächten pro Woche schlecht schlafen, spricht man von Insomnie, und damit sollten Sie zu einer Ärztin oder einem Arzt gehen. Sie lässt sich gut behandeln, meist ohne Tabletten, mit kognitiver Verhaltenstherapie. Die Tipps oben stammen daraus, aber in der Praxis werden sie genau auf Sie abgestimmt.","breatheTitle":"4-7-8-Atmung","breatheLead":"Durch die Nase einatmen und bis 4 zählen, den Atem bis 7 anhalten, langsam durch den Mund ausatmen und bis 8 zählen. Vier Runden. Das lange Ausatmen verlangsamt den Puls und hilft dem Körper, auf Ruhe umzuschalten.","breatheStart":"Starten","breatheStop":"Anhalten","breatheIn":"Einatmen","breatheHold":"Halten","breatheOut":"Ausatmen","breatheRound":"Runde {n} von 4","breatheDone":"Gut so. Jetzt können Sie ins Zimmer gehen.","howTitle":"So funktioniert es","how":[{"t":"Wählen Sie ein Zimmer","b":"Es sind zehn, und jedes ist anders. Bewegen Sie die Maus oder neigen Sie Ihr Handy, und das Zimmer dreht sich ein wenig."},{"t":"Machen Sie es sich bequem","b":"Schalten Sie die Lampe, den Regen oder den Fernseher ein. Streicheln Sie die Katze, und sie fängt an zu schnurren."},{"t":"Stellen Sie den Timer","b":"Das Zimmer schläft nach und nach ein: Der Fernseher geht aus, die Lampe wird schwächer, die Katze schläft ein, der Ton verklingt, der Bildschirm wird dunkel."}],"payTitle":"Zahlen Sie, wenn es Ihnen gefällt","payLead":"Die Seite ist kostenlos und ohne Werbung. Wenn die Nacht ruhig war, können Sie ein kleines Dankeschön dalassen.","footer":"Stille Nacht. Für alle, die nicht schlafen können.","notesTitle":"Wie Sie einschlafen","notesLead":"Hier stehen Tipps von Besucherinnen und Besuchern der Seite, unbearbeitet. Wenn Sie Ihren eigenen Weg zum Einschlafen gefunden haben, teilen Sie ihn: Nach einer kurzen Prüfung erscheint er hier.","notesPh":"Was hilft Ihnen beim Einschlafen? Zum Beispiel nach einem schweren Tag oder an einem fremden Ort","notesSend":"Senden","notesSent":"Danke. Ihr Tipp erscheint hier, sobald wir ihn gelesen haben.","notesEmpty":"Noch ist es hier leer. Ihr Tipp könnte der erste sein.","notesFail":"Das Senden hat nicht geklappt. Bitte versuchen Sie es später noch einmal.","notesAnon":"Besucher"},"scenes":{"room":{"title":"Das stille Zimmer","tag":"Ex-Sowjetunion · Erdgeschoss","place":"Ex-Sowjetunion","lamp":"Stehlampe","intro":"Eine Wohnung im Erdgeschoss. Mondlicht fällt durch die Balkontür, eine Stehlampe brennt, auf der Fensterbank sitzt eine weiße Katze.","hint":"Tippen Sie auf die Katze oder streicheln Sie sie, und sie fängt an zu schnurren","sounds":""},"dacha":{"title":"Die Datscha","tag":"Veranda · August","place":"Ex-Sowjetunion","lamp":"Lampenschirm","intro":"Eine verglaste Veranda am Ende des Sommers. Tee im Glas mit Metallhalter und Kirschkonfitüre, Geranien auf der Fensterbank, durch die offene Tür sieht man den Garten und das Gewächshaus. Auf der Schwelle sitzt eine weiße Katze.","hint":"Tippen Sie auf die Katze, und sie fängt an zu schnurren. Ein Tippen auf den Lampenschirm schaltet das Licht ein","sounds":""},"ca":{"title":"Der Hof unter der Weinlaube","tag":"Zentralasien · Sommer","place":"Zentralasien","lamp":"Lampe","intro":"Ein Tapchan, ein breites Holzbett, unter der Weinlaube, darauf gesteppte Matratzen und auf einem Tablett eine Teekanne mit Trinkschalen, ein blaues Tor in der Lehmmauer. Auf den warmen Fliesen sitzt eine weiße Katze.","hint":"Tippen Sie auf die Katze, und sie fängt an zu schnurren. Ein Tippen auf die Lampe schaltet das Licht ein","sounds":""},"korea":{"title":"Die Wohnung in Seoul","tag":"am Hang · Sommer","place":"Korea","lamp":"Lampe","intro":"Eine Wohnung am Hang. Ein warmer gelber Fußboden, Gerstentee auf einem niedrigen Tisch, hinter dem Balkon die Lichter des Viertels. Auf dem Boden sitzt eine weiße Katze.","hint":"Tippen Sie auf die Katze, und sie fängt an zu schnurren. Ein Tippen auf die Lampe schaltet das Licht ein","sounds":""},"jp":{"title":"Das japanische Haus","tag":"Engawa · Sommer","place":"Japan","lamp":"Andon-Laterne","intro":"Die Shōji-Schiebewände stehen offen zum Sommergarten: ein Teich mit Seerosen, eine Steinlaterne, Glühwürmchen. Auf der Engawa, der hölzernen Veranda, sitzt eine weiße Katze, unter dem Vordach hängt ein Furin-Windspiel.","hint":"Tippen Sie auf die Katze, und sie fängt an zu schnurren. Das Furin-Windspiel klingt, wenn man es berührt","sounds":""},"china":{"title":"Das Zimmer am Hof","tag":"China · Sommer","place":"China","lamp":"Schreibtischlampe","intro":"Ein Zimmer mit Tür zum Hof. Ein Ventilator, eine Thermoskanne und ein Emaillebecher, eine Matte auf dem Bett, im Hof trocknet Wäsche. Auf der Schwelle sitzt eine weiße Katze.","hint":"Tippen Sie auf die Katze, und sie fängt an zu schnurren. Ein Tippen auf die Lampe schaltet das Licht ein","sounds":""},"sea":{"title":"Das Pfahlhaus","tag":"Südostasien","place":"Südostasien","lamp":"Laterne","intro":"Ein Holzhaus an den Reisfeldern. Ein Moskitonetz, eine Laterne an der Wand, ein Glas kalter Tee, hinter dem Geländer Glühwürmchen über dem Wasser und Palmen. Auf dem Balkon sitzt eine weiße Katze.","hint":"Tippen Sie auf die Katze, und sie fängt an zu schnurren. Ein Tippen löscht die Laterne","sounds":""},"india":{"title":"Die Veranda nach dem Regen","tag":"Indien · Monsun","place":"Indien","lamp":"Petroleumlampe","intro":"Die Veranda eines Dorfhauses nach dem Regen. Ein Charpai, ein Bett aus geflochtenen Seilen, eine Petroleumlampe auf einem Hocker, ein Stahlbecher mit Chai, der nasse Hof mit dem Brunnen im Mondlicht. Auf den Fliesen sitzt eine weiße Katze.","hint":"Tippen Sie auf die Katze, und sie fängt an zu schnurren. Ein Tippen löscht die Lampe","sounds":""},"usa":{"title":"Das Zimmer in der Vorstadt","tag":"USA","place":"USA","lamp":"Lampe","intro":"Ein Schlafzimmer in der Vorstadt. Poster, eine Lavalampe, ein Kassettenrekorder, ein Becher Kakao, vor dem Fenster ein Rasen und ein Baumhaus. Auf dem Teppich sitzt eine weiße Katze.","hint":"Tippen Sie auf die Katze, und sie fängt an zu schnurren. Ein Tippen auf die Lampe schaltet das Licht ein","sounds":""},"latam":{"title":"Das Haus mit Patio","tag":"Lateinamerika","place":"Lateinamerika","lamp":"Lampe","intro":"Ein altes Haus mit einer Bogentür zum Patio: ein Schaukelstuhl, Spitzenvorhänge, eine Lichterkette über den Blumen, eine Tasse Kaffee. In der Tür sitzt eine weiße Katze.","hint":"Tippen Sie auf die Katze, und sie fängt an zu schnurren. Ein Tippen auf die Lampe schaltet das Licht ein","sounds":""}}},"ja":{"meta":{"lang":"ja","name":"日本語","site":"静かな夜"},"ui":{"rooms":"部屋","prevRoom":"前の部屋","nextRoom":"次の部屋","home":"ホームへ","tv":"テレビ","rain":"雨","timer":"スリープタイマー","breathe":"呼吸","sound":"音","close":"閉じる","loading":"部屋を読み込んでいます…","wakeTap":"タップして目を覚ます","sceneControls":"シーンの操作","sceneLabel":"夜の部屋","timerText":"明かりがゆっくり消えていき、猫が眠り、音も静かになります。最後に画面が真っ暗になります。","timerTextOn":"別の時間にすることも、タイマーを止めることもできます。","timerOff":"タイマーを止める","min":"{n}分","timerSet":"{n}分のタイマーをセットしました。明かりは自然に消えます","timerCancelled":"タイマーを止めました","cat":"猫","furin":"風鈴","pond":"池","puddle":"水たまり","soundOn":"音をオンにしました","soundOff":"音をオフにしました","morning":"おはようございます","morningText":"{time}に「{room}」で眠りにつきました。","payOwn":"金額を指定","payNote":"金額はお気持ちで。払わなくても大丈夫です。お支払いはPayPalで。","payNoteWake":"静かな夜を過ごせたら、お礼を残していただけるとうれしいです。金額はお好きなだけ、なしでも大丈夫です。","payThanks":"ありがとうございます。PayPalが新しいタブで開きます。","backToRoom":"部屋に戻る","soundsLabel":"聞こえる音：","fullscreen":"全画面","fsIos":"全画面で見るには：共有 →「ホーム画面に追加」","rainL0":"雨をオフ","rainL1":"小雨","rainL2":"本降りの雨","rainL3":"大雨","radio":"ラジカセ","radio0":"ラジカセをオフ","radio1":"ラジオ：シンセポップ","radio2":"ラジオ：静かなバラード","fsTap":"画面をタップすると全画面表示になります"},"home":{"navRooms":"部屋","navTips":"眠るために","navBreathe":"呼吸","navAbout":"使い方","lang":"言語","heroLead":"世界のあちこちにある、夜の部屋。ランプや雨をつけて、白い猫をなでて、タイマーをセットしましょう。部屋もあなたと一緒に眠りにつきます。","heroCta":"部屋に入る","heroCtaLast":"続きから：{room}","heroNote":"音が出ます。ヘッドホンがおすすめです。","roomsTitle":"部屋","roomsLead":"10の部屋、それぞれの窓の外に、それぞれの夜。","tipsTitle":"眠りにつくために","tipsLead":"魔法のような方法はありません。睡眠の専門家がすすめる、ごく当たり前のことばかりです。全部を一度にやる必要はありません。自分に近い状況を見つけて、ひとつだけ、少なくとも1週間続けてみてください。","tips":[{"k":"寝る時間が毎日ばらばらなら","t":"寝る時刻より、起きる時刻の目覚まし","b":"無理に眠ることはできませんが、同じ時間に起きることはできます。よく眠れなかった夜のあとも、土曜日もです。最初の1週間はつらく、昼間に横になりたくなるでしょう。でも、できれば横にならないでください。夜までに眠気がたまって、早く寝つけます。たいてい2〜3週間で体が慣れてきます。"},{"k":"20分以上、寝返りばかり打っているなら","t":"起きてしまいましょう。意外ですが、効きます","b":"眠れないことにいらいらしながら横になっていると、布団が不安と結びついてしまいます。台所へ行って小さな明かりをつけ、紙の本や古い雑誌をぱらぱらめくってみてください。スマホは見ずに、明るい光も避けて。まぶたが重くなってきたら戻りましょう。はじめは一晩に2、3回起きることになりますが、だんだん減っていきます。"},{"k":"明日のことが頭から離れないなら","t":"枕元のメモに、やることを書き出す","b":"寝る5分前に、明日やることを全部書き出します。箇条書きでも、走り書きでもかまいません。もう済んだことは書かなくて大丈夫です。これからのことだけを。小さな実験では、このリストを書いた人のほうがはっきり早く眠りにつきました。書いてしまえば、その考えは朝まで手放せます。"},{"k":"午後にもコーヒーを飲むなら","t":"最後の一杯は午後2時までに","b":"カフェインはゆっくりとしか抜けません。5〜6時間たっても、血液中にはおよそ半分が残っています。夕方4時の一杯は、夜10時にもまだ効いています。コーヒーで目が冴える感じがしなくても、です。濃いめの紅茶や緑茶、コーラ、チョコレートも同じように数えてください。"},{"k":"寝る前の一杯が習慣になっているなら","t":"お酒で寝つけても、夜中の3時に目が覚めます","b":"飲んでから最初の数時間は、ぐっすり眠れます。そのあと体がアルコールを分解しはじめると、眠りが途切れがちになります。暑くなったり喉が渇いたりして目が覚め、なかなか寝直せません。夜の習慣がほしいなら、温かい牛乳やハーブティーを試してみてください。大事なのは飲み物そのものより、手の中の温かいカップと、眠る前のひと息です。"},{"k":"寝室が蒸し暑いなら","t":"涼しい部屋と、暖かい布団","b":"眠りにつくには、体が少し冷える必要があります。いちばん眠りやすいのは、室温が18〜20 °Cくらいのときです。寝る前に換気をして、寒くないように厚めの布団をかけるか、靴下をはいてください。ちなみに、足が温かいと寝つきも早くなります。"},{"k":"遅くまでスマホを見てしまうなら","t":"寝る1時間前から、明かりを暖かく、暗めに","b":"天井の照明を消して、電球色のフロアランプやデスクライトだけにします。明るい白い光、とくに顔のすぐ前にある画面の光は、脳に「まだ昼だ」と伝えてしまいます。どうしてもスマホを使うなら、明るさを最低まで下げて、暖色のナイトモードをオンに。このサイトの部屋がこんなに暗く、タイマーが自動で画面を消すのも、そのためです。"},{"k":"体は疲れているのに、頭が冴えているなら","t":"寝る1時間〜1時間半前に、温かいシャワーを","b":"寝る直前の熱いお風呂ではなく、早めに温かいシャワーを浴びます。そのあと肌から熱が逃げて体温が下がり、それが眠りの合図のひとつになります。涼しい寝室と組み合わせると、よく効きます。"},{"k":"夜中に目が覚めてしまうなら","t":"時計を見ないでください","b":"3:47と目に入った瞬間、計算が始まります。目覚ましまであと3時間、明日は打ち合わせ、早く眠らなきゃ。そうして眠気はすっかり消えてしまいます。時計は壁のほうに向け、スマホは画面を下にして、ベッドから離れたところに置いてください。"},{"k":"隣の部屋や外の音が気になるなら","t":"静けさより、一定の音を","b":"まったくの静けさの中では、ドアが閉まる音ひとつで目が覚めます。雨音や扇風機のような一定の音は、急な物音をやわらげてくれます。電車の揺れと音の中でよく眠れたのも、たぶんそのせいです。"},{"k":"朝なかなか起きられないなら","t":"朝は光を浴びて、せめて10分","b":"お茶を持ってベランダに出る、駅まで歩く、窓辺に座る。朝の光は体内時計を整えてくれるので、夜の眠気が夜中の2時ではなく、ちょうどいい時間にやってきます。曇りの日でも、外は部屋の中より明るいものです。"},{"k":"心臓がどきどきして落ち着かないなら","t":"吸うより長く吐く","b":"吐く息が吸う息より長いと、脈はゆっくりになります。魔法ではなく、体の仕組みです。すぐ下にある4-7-8呼吸を試してみてください。7つ数えるあいだ息を止めるのがつらければ、4つで吸って6つで吐くところから始めましょう。少しくらっとしたら、ふだんどおり楽に呼吸してください。"}],"tipsNote":"よく眠れない夜が週に3回以上、3か月より長く続いているなら、それはもう不眠症で、医師に相談したほうがいい状態です。不眠症はきちんと治療でき、多くの場合は薬を使わず、認知行動療法で治していきます。上のコツもそこから来ていますが、医師ならあなたに合ったものを選んでくれます。","breatheTitle":"4-7-8呼吸","breatheLead":"鼻から4つ数えて吸い、7つ数えるあいだ止めて、口から8つ数えてゆっくり吐きます。これを4回。長く吐くことで脈がゆっくりになり、体が休むモードに切り替わりやすくなります。","breatheStart":"始める","breatheStop":"やめる","breatheIn":"吸って","breatheHold":"止めて","breatheOut":"吐いて","breatheRound":"{n}回目（全4回）","breatheDone":"いいですね。では、部屋へどうぞ。","howTitle":"使い方","how":[{"t":"部屋を選ぶ","b":"部屋は10室、どれも違います。マウスを動かすか、スマートフォンを傾けると、部屋が少しだけ動きます。"},{"t":"くつろぐ","b":"ランプや雨、テレビをつけましょう。猫をなでると、のどを鳴らします。"},{"t":"タイマーをセット","b":"部屋は少しずつ眠りにつきます。テレビが消え、ランプが暗くなり、猫が眠り、音が静かになって、画面が暗くなります。"}],"payTitle":"気に入ったら、お気持ちで","payLead":"このサイトは無料で、広告もありません。静かな夜を過ごせたら、お礼を残していただけるとうれしいです。","footer":"静かな夜。眠れない人たちへ。","notesTitle":"あなたの眠り方","notesLead":"ここには、訪れた人たちのコツを手を加えずに載せています。あなたなりの眠り方があれば、ぜひ教えてください。確認したあと、ここに載ります。","notesPh":"眠るために、何が役立っていますか？たとえば大変な一日のあとや、慣れない場所で","notesSend":"送信","notesSent":"ありがとうございます。読ませていただいたあと、ここに載ります。","notesEmpty":"まだ何もありません。あなたのコツが最初のひとつになるかもしれません。","notesFail":"送信できませんでした。しばらくしてから、もう一度お試しください。","notesAnon":"訪問者"},"scenes":{"room":{"title":"静かな部屋","tag":"旧ソ連 · 1階","place":"旧ソ連","lamp":"フロアランプ","intro":"アパートの1階の部屋。バルコニーの扉から差し込む月明かり、フロアランプ、窓辺には白い猫。","hint":"猫をタップするか、なでてあげると、のどを鳴らします","sounds":""},"dacha":{"title":"ダーチャ","tag":"ベランダ · 8月","place":"旧ソ連","lamp":"吊りランプ","intro":"ガラス張りのベランダ、夏の終わり。ホルダー付きのグラスで飲む紅茶とさくらんぼのジャム、窓辺のゼラニウム。開いた扉から庭と温室が見えます。戸口には白い猫が座っています。","hint":"猫をタップすると、のどを鳴らします。吊りランプはタップでつきます","sounds":""},"ca":{"title":"縁台のある中庭","tag":"中央アジア · 夏","place":"中央アジア","lamp":"ランプ","intro":"ぶどう棚の下の縁台に、綿入れの敷物クルパチ。盆の上にはティーポットと茶碗、土壁には青い門。温かいタイルの上に白い猫が座っています。","hint":"猫をタップすると、のどを鳴らします。ランプをタップすると明かりがつきます","sounds":""},"korea":{"title":"ソウルの坂の上の家","tag":"丘の斜面 · 夏","place":"韓国","lamp":"ランプ","intro":"丘の斜面に建つアパート。温かな黄色い床、低い座卓には麦茶、ベランダの向こうに街の灯り。床の上に白い猫が座っています。","hint":"猫をタップすると、のどを鳴らします。ランプをタップすると明かりがつきます","sounds":""},"jp":{"title":"日本の家","tag":"縁側 · 夏","place":"日本","lamp":"行灯","intro":"障子が夏の庭に向けて開け放たれています。睡蓮の池、石灯籠、蛍。縁側には白い猫が座り、軒先には風鈴が下がっています。","hint":"猫をタップすると、のどを鳴らします。風鈴はさわると鳴ります","sounds":""},"china":{"title":"中庭に面した部屋","tag":"中国 · 夏","place":"中国","lamp":"電気スタンド","intro":"中庭に面した部屋。扇風機、魔法瓶、ホーローのマグカップ、ベッドにはござ、中庭には洗濯物。戸口に白い猫が座っています。","hint":"猫をタップすると、のどを鳴らします。ランプをタップすると明かりがつきます","sounds":""},"sea":{"title":"高床の家","tag":"東南アジア","place":"東南アジア","lamp":"ランタン","intro":"田んぼのそばの木造の家。蚊帳、壁のランタン、冷たいお茶のグラス。手すりの向こうには水面を舞う蛍とヤシの木。バルコニーに白い猫が座っています。","hint":"猫をタップすると、のどを鳴らします。ランタンはタップで消えます","sounds":""},"india":{"title":"雨上がりのベランダ","tag":"インド · モンスーン","place":"インド","lamp":"灯油ランプ","intro":"雨上がりの、村の家のベランダ。縄編みの寝台チャールパーイー、腰掛けの上の灯油ランプ、ステンレスのコップに入ったチャイ、月明かりの下の濡れた中庭と井戸。タイルの上に白い猫が座っています。","hint":"猫をタップすると、のどを鳴らします。ランプはタップで消せます","sounds":""},"usa":{"title":"郊外の部屋","tag":"アメリカ","place":"アメリカ","lamp":"ランプ","intro":"郊外の寝室。ポスター、ラバランプ、ラジカセ、ココアのマグカップ。窓の外には芝生とツリーハウス。カーペットの上に白い猫が座っています。","hint":"猫をタップすると、のどを鳴らします。ランプをタップすると明かりがつきます","sounds":""},"latam":{"title":"パティオのある家","tag":"ラテンアメリカ","place":"ラテンアメリカ","lamp":"ランプ","intro":"パティオに続くアーチ型の扉がある古い家。ロッキングチェア、レースのカーテン、花の上に渡した電飾、一杯のコーヒー。戸口に白い猫が座っています。","hint":"猫をタップすると、のどを鳴らします。ランプをタップすると明かりがつきます","sounds":""}}},"ko":{"meta":{"lang":"ko","name":"한국어","site":"고요한 밤"},"ui":{"rooms":"방","prevRoom":"이전 방","nextRoom":"다음 방","home":"홈으로","tv":"TV","rain":"비","timer":"수면 타이머","breathe":"호흡","sound":"소리","close":"닫기","loading":"방을 불러오는 중…","wakeTap":"탭하거나 클릭해서 깨어나기","sceneControls":"장면 조작","sceneLabel":"밤의 방","timerText":"불빛이 천천히 꺼지고, 고양이가 잠들고, 소리가 잦아들어요. 마지막에는 화면이 까맣게 돼요.","timerTextOn":"다른 시간으로 바꾸거나 타이머를 끌 수 있어요.","timerOff":"타이머 끄기","min":"{n}분","timerSet":"{n}분 타이머를 맞췄어요. 불빛은 저절로 꺼져요","timerCancelled":"타이머를 껐어요","cat":"고양이","furin":"풍경","pond":"연못","puddle":"물웅덩이","soundOn":"소리를 켰어요","soundOff":"소리를 껐어요","morning":"좋은 아침이에요","morningText":"{time}에 '{room}'에서 잠들었어요.","payOwn":"직접 입력","payNote":"원하는 만큼, 아니면 내지 않아도 괜찮아요. 결제는 PayPal로 해요.","payNoteWake":"조용한 밤이었다면 고마운 마음을 남겨 주셔도 좋아요. 원하는 만큼 내도 되고, 내지 않아도 괜찮아요.","payThanks":"고마워요. 새 탭에서 PayPal이 열려요.","backToRoom":"방으로 돌아가기","soundsLabel":"들리는 소리:","fullscreen":"전체 화면","fsIos":"전체 화면으로 보려면: 공유 → 홈 화면에 추가","rainL0":"비 끄기","rainL1":"가벼운 비","rainL2":"보통 비","rainL3":"폭우","radio":"붐박스","radio0":"붐박스 꺼짐","radio1":"라디오: 신스팝","radio2":"라디오: 잔잔한 발라드","fsTap":"화면을 탭하면 전체 화면으로 전환됩니다"},"home":{"navRooms":"방","navTips":"잠드는 법","navBreathe":"호흡","navAbout":"이용 방법","lang":"언어","heroLead":"세계 곳곳의 밤의 방들. 램프나 빗소리를 켜고, 하얀 고양이를 쓰다듬고, 타이머를 맞춰 보세요. 방도 당신과 함께 잠들어요.","heroCta":"방에 들어가기","heroCtaLast":"이어서: {room}","heroNote":"소리가 나와요. 헤드폰으로 들으면 더 좋아요.","roomsTitle":"방","roomsLead":"방은 열 곳, 창밖마다 저마다의 밤이 있어요.","tipsTitle":"잠드는 데 도움이 되는 것들","tipsLead":"마법 같은 방법은 없어요. 수면 전문가들이 권하는 평범한 것들이에요. 한꺼번에 다 할 필요는 없어요. 내 상황을 찾아서 하나만 골라 적어도 일주일은 해 보세요.","tips":[{"k":"잠드는 시간이 매번 다르다면","t":"잠드는 시간보다 일어나는 알람이 더 중요해요","b":"억지로 잠들 수는 없지만, 같은 시간에 일어나는 건 할 수 있어요. 잠을 설친 다음 날에도, 토요일에도요. 첫 주는 힘들고 낮에 자꾸 눕고 싶어질 거예요. 그래도 눕지 않는 게 좋아요. 저녁까지 졸음이 쌓여서 더 빨리 잠들 수 있거든요. 보통 2~3주면 몸이 익숙해져요."},{"k":"20분 넘게 뒤척이고 있다면","t":"일어나세요. 이상하게 들려도 효과가 있어요","b":"잠이 안 온다고 짜증을 내며 누워 있으면, 침대가 불안과 연결돼 버려요. 부엌으로 나가 작은 불을 켜고, 종이책이나 오래된 잡지를 넘겨 보세요. 휴대폰은 보지 말고, 밝은 불도 켜지 말고요. 눈꺼풀이 무거워지면 그때 돌아오세요. 처음엔 하룻밤에 두세 번 일어나야 하겠지만, 점점 줄어들어요."},{"k":"내일 일이 머릿속을 맴돈다면","t":"침대 옆 메모지에 할 일 적기","b":"자기 5분 전에 내일 할 일을 전부 적어 보세요. 목록으로 써도 되고 대충 휘갈겨도 괜찮아요. 이미 한 일은 적지 않아도 돼요. 앞으로 할 일만요. 한 작은 실험에서는 이런 목록을 쓴 사람들이 눈에 띄게 빨리 잠들었어요. 적어 둔 생각은 아침까지 내려놓아도 되니까요."},{"k":"오후에도 커피를 마신다면","t":"마지막 한 잔은 오후 2시 전에","b":"카페인은 천천히 빠져나가요. 5~6시간이 지나도 핏속에 절반쯤 남아 있어요. 오후 4시에 마신 커피는 밤 10시에도 아직 작용해요. 커피를 마셔도 별로 안 깬다고 느끼더라도요. 진한 홍차와 녹차, 콜라, 초콜릿도 마찬가지예요."},{"k":"자기 전 한 잔이 습관이 됐다면","t":"술은 잠을 부르지만, 새벽 3시에 깨워요","b":"술을 마시고 처음 몇 시간은 푹 자요. 그런데 몸이 알코올을 분해하기 시작하면 잠이 자꾸 끊겨요. 덥고, 목이 마르고, 한번 깨면 다시 잠들기가 어려워요. 저녁 의식이 필요하다면 따뜻한 우유나 허브차를 마셔 보세요. 중요한 건 음료 자체보다 손에 쥔 따뜻한 잔과 잠들기 전의 짧은 쉼이에요."},{"k":"침실이 답답하다면","t":"서늘한 방, 따뜻한 이불","b":"잠들려면 몸이 조금 식어야 해요. 방 온도가 18~20 °C 정도일 때 가장 잘 자요. 자기 전에 환기를 하고, 춥지 않게 두꺼운 이불을 덮거나 양말을 신으세요. 참고로 발이 따뜻하면 잠도 더 빨리 와요."},{"k":"휴대폰을 붙잡고 늦게까지 깨어 있다면","t":"자기 1시간 전부터는 불빛을 따뜻하고 어둡게","b":"천장 등은 끄고, 따뜻한 색 전구를 단 스탠드나 탁상등만 켜 두세요. 밝은 흰 빛, 특히 얼굴 바로 앞 화면에서 나오는 빛은 뇌에 아직 낮이라고 알려요. 휴대폰을 꼭 봐야 한다면 밝기를 최저로 낮추고 따뜻한 야간 모드를 켜세요. 이곳의 방들이 이렇게 어둡고 타이머가 알아서 화면을 꺼 주는 것도 그래서예요."},{"k":"몸은 지쳤는데 머리는 말똥말똥하다면","t":"자기 1시간~1시간 반 전에 따뜻한 샤워","b":"자기 직전의 뜨거운 목욕이 아니라, 미리 하는 따뜻한 샤워예요. 샤워 후 피부로 열이 빠져나가면서 체온이 내려가는데, 이게 잠이 오는 신호 중 하나예요. 서늘한 침실과 함께하면 효과가 좋아요."},{"k":"한밤중에 깬다면","t":"몇 시인지 보지 마세요","b":"3:47을 보는 순간 계산이 시작돼요. 알람까지 세 시간, 내일은 회의, 빨리 자야 하는데. 그러다 잠이 완전히 달아나요. 시계는 벽 쪽으로 돌려 두고, 휴대폰은 화면을 아래로 해서 침대에서 먼 곳에 두세요."},{"k":"이웃이나 바깥 소리가 신경 쓰인다면","t":"고요함 대신 고른 소리","b":"아주 조용하면 문 닫히는 소리 하나에도 깨요. 빗소리나 선풍기 소리처럼 고른 소리는 갑작스러운 소음을 부드럽게 덮어 줘요. 기차에서 덜컹거리는 소리를 들으며 유난히 잘 잤던 것도 아마 그래서일 거예요."},{"k":"아침에 도저히 못 일어나겠다면","t":"아침엔 빛을 보세요, 10분이라도","b":"차를 들고 베란다에 나가거나, 정류장까지 걸어가거나, 창가에 앉아 보세요. 아침 햇빛은 몸속 시계를 맞춰 줘서, 저녁에 졸음이 새벽 2시가 아니라 제때 찾아와요. 흐린 날에도 바깥은 집 안보다 밝아요."},{"k":"심장이 두근거려 진정이 안 된다면","t":"들이쉬는 것보다 길게 내쉬세요","b":"내쉬는 숨이 들이쉬는 숨보다 길면 맥박이 느려져요. 마법이 아니라 몸의 원리예요. 바로 아래 있는 4-7-8 호흡을 해 보세요. 일곱을 셀 동안 숨을 참기 힘들다면, 넷에 들이쉬고 여섯에 내쉬는 것부터 시작하세요. 살짝 어지러우면 그냥 편하게 숨 쉬면 돼요."}],"tipsNote":"일주일에 세 밤 이상 잠을 설치는 일이 석 달 넘게 이어진다면, 그건 이미 불면증이고 병원에 가 보는 게 좋아요. 불면증은 치료가 잘 되고, 대개 약 없이 인지행동치료로 나아져요. 위의 팁도 거기서 나온 것이지만, 의사는 나에게 꼭 맞는 방법을 골라 줄 거예요.","breatheTitle":"4-7-8 호흡","breatheLead":"코로 넷을 세며 들이쉬고, 일곱을 세는 동안 숨을 멈췄다가, 입으로 여덟을 세며 천천히 내쉬어요. 이렇게 네 번 반복해요. 길게 내쉬는 숨이 맥박을 늦추고, 몸이 쉬는 상태로 넘어가도록 도와줘요.","breatheStart":"시작하기","breatheStop":"그만하기","breatheIn":"들이쉬기","breatheHold":"멈추기","breatheOut":"내쉬기","breatheRound":"4번 중 {n}번째","breatheDone":"좋아요. 이제 방으로 가 볼까요.","howTitle":"이용 방법","how":[{"t":"방 고르기","b":"방은 열 개, 모두 달라요. 마우스를 움직이거나 휴대폰을 기울이면 방이 살짝 움직여요."},{"t":"자리 잡기","b":"램프나 빗소리, TV를 켜 보세요. 고양이를 쓰다듬으면 가르랑거려요."},{"t":"타이머 맞추기","b":"방은 천천히 잠들어요. TV가 꺼지고, 램프가 흐려지고, 고양이가 잠들고, 소리가 잦아들고, 화면이 어두워져요."}],"payTitle":"마음에 들었다면 원하는 만큼","payLead":"이 사이트는 무료이고 광고도 없어요. 조용한 밤이었다면 고마운 마음을 남겨 주셔도 좋아요.","footer":"고요한 밤. 잠 못 드는 사람들을 위해.","notesTitle":"여러분은 어떻게 잠드나요","notesLead":"방문자들이 남긴 팁을 고치지 않고 그대로 실었어요. 나만의 잠드는 방법이 있다면 나눠 주세요. 확인한 뒤 여기에 올라와요.","notesPh":"무엇이 잠드는 데 도움이 되나요? 예를 들어 힘든 하루를 보낸 뒤나 낯선 곳에서","notesSend":"보내기","notesSent":"고마워요. 저희가 읽고 나면 여기에 올라와요.","notesEmpty":"아직 비어 있어요. 당신의 팁이 첫 번째가 될 수도 있어요.","notesFail":"보내지 못했어요. 잠시 후 다시 시도해 주세요.","notesAnon":"방문자"},"scenes":{"room":{"title":"고요한 방","tag":"구소련 · 1층","place":"구소련","lamp":"장스탠드","intro":"아파트 1층. 발코니 문으로 들어오는 달빛, 장스탠드, 그리고 창턱 위의 하얀 고양이.","hint":"고양이를 탭하거나 클릭하거나 쓰다듬으면 가르랑거려요","sounds":""},"dacha":{"title":"다차","tag":"베란다 · 8월","place":"구소련","lamp":"갓등","intro":"유리로 둘러싼 베란다, 늦여름. 컵 홀더에 끼운 유리잔의 홍차와 체리 잼, 창턱의 제라늄. 열린 문 너머로 텃밭과 온실이 보여요. 문턱에 하얀 고양이가 앉아 있어요.","hint":"고양이를 탭하거나 클릭하면 가르랑거려요. 갓등은 탭하거나 클릭하면 켜져요","sounds":""},"ca":{"title":"평상이 있는 마당","tag":"중앙아시아 · 여름","place":"중앙아시아","lamp":"램프","intro":"포도 덩굴 아래 평상, 그 위에 깔린 누빔 요 쿠르파차, 쟁반 위의 찻주전자와 찻사발, 흙벽에 난 파란 대문. 따뜻한 타일 위에 하얀 고양이가 앉아 있어요.","hint":"고양이를 탭하거나 클릭하면 가르랑거려요. 램프를 탭하거나 클릭하면 불이 켜져요","sounds":""},"korea":{"title":"서울의 아파트","tag":"언덕 위 · 여름","place":"한국","lamp":"램프","intro":"언덕 위의 아파트. 따뜻한 노란 장판, 낮은 상 위의 보리차, 베란다 너머 동네 불빛. 바닥에 하얀 고양이가 앉아 있어요.","hint":"고양이를 탭하거나 클릭하면 가르랑거려요. 램프를 탭하거나 클릭하면 불이 켜져요","sounds":""},"jp":{"title":"일본의 집","tag":"엔가와 · 여름","place":"일본","lamp":"안돈","intro":"쇼지 문이 여름 정원 쪽으로 열려 있어요. 수련이 핀 연못, 석등, 반딧불이. 툇마루 엔가와에 하얀 고양이가 앉아 있고, 처마 끝에는 풍경이 걸려 있어요.","hint":"고양이를 탭하거나 클릭하면 가르랑거려요. 풍경은 건드리면 울려요","sounds":""},"china":{"title":"마당 쪽 방","tag":"중국 · 여름","place":"중국","lamp":"탁상 스탠드","intro":"마당으로 이어지는 방. 선풍기, 보온병, 법랑 머그잔, 침대 위의 대자리, 마당에 널린 빨래. 문턱에 하얀 고양이가 앉아 있어요.","hint":"고양이를 탭하거나 클릭하면 가르랑거려요. 램프를 탭하거나 클릭하면 불이 켜져요","sounds":""},"sea":{"title":"기둥 위의 집","tag":"동남아시아","place":"동남아시아","lamp":"랜턴","intro":"논 옆의 나무집. 모기장, 벽에 걸린 랜턴, 차가운 차 한 잔. 난간 너머로 물 위의 반딧불이와 야자나무가 보여요. 발코니에 하얀 고양이가 앉아 있어요.","hint":"고양이를 탭하거나 클릭하면 가르랑거려요. 랜턴은 탭하거나 클릭하면 꺼져요","sounds":""},"india":{"title":"비 갠 뒤의 베란다","tag":"인도 · 몬순","place":"인도","lamp":"석유 램프","intro":"비가 그친 시골집 베란다. 끈을 엮은 침상 차르파이, 걸상 위의 석유 램프, 스테인리스 컵에 담긴 짜이, 달빛 아래 우물이 있는 젖은 마당. 타일 위에 하얀 고양이가 앉아 있어요.","hint":"고양이를 탭하거나 클릭하면 가르랑거려요. 램프는 탭하거나 클릭하면 꺼져요","sounds":""},"usa":{"title":"교외의 방","tag":"미국","place":"미국","lamp": 脑子里一直在想明天的事","t":"床边放张纸，写下要做的事","b":"睡前花五分钟，把明天要做的事都写下来，列条目也好，随手涂几笔也行。不用写已经做完的，只写接下来要做的。在一个小实验里，写了这种清单的人明显睡得更快。想法落到纸上，就可以放到明早再说。"},{"k":"如果下午还在喝咖啡","t":"最后一杯，在下午两点前","b":"咖啡因代谢得很慢：过了五六个小时，血液里还剩大约一半。下午四点那杯，到晚上十点还在起作用，哪怕你觉得咖啡已经提不了神。浓的红茶和绿茶、可乐、巧克力也都算在内。"},{"k":"如果睡前小酌成了习惯","t":"酒让人犯困，却会在凌晨三点把你弄醒","b":"喝完酒的头几个小时，睡得很沉。之后身体开始分解酒精，睡眠就变得断断续续：发热、口渴，醒来后很久都睡不回去。如果你需要一个睡前的小仪式，试试热牛奶或花草茶。关键不在喝什么，而在手里那杯温热的东西，和睡前停下来的那一会儿。"},{"k":"如果卧室里很闷","t":"凉一点的房间，暖一点的被子","b":"要睡着，身体需要稍微降一点温。房间在18–20 °C左右时最好睡。睡前开窗通通风；怕冷的话，换条厚点的被子，或者穿上袜子。顺便一提，脚暖和了也更容易睡着。"},{"k":"如果总是抱着手机熬夜","t":"睡前一小时，灯光调暖、调暗","b":"关掉顶灯，只留一盏暖光的落地灯或台灯。明亮的白光，尤其是凑在脸前的屏幕光，会告诉大脑现在还是白天。如果实在离不开手机，就把亮度调到最低，打开暖色夜间模式。这里的房间这么暗，计时器会自己熄屏，也是这个原因。"},{"k":"如果身体累了，脑子却停不下来","t":"睡前一到一个半小时，冲个温水澡","b":"不是临睡前泡个热水澡，而是提前冲个温水澡。洗完后皮肤散热，体温下降，这正是入睡的信号之一。和凉爽的卧室搭配，效果很好。"},{"k":"如果半夜醒来","t":"别看时间","b":"一看到3:47，脑子就开始算：离闹钟还有三个小时，明天还要开会，得赶紧睡着。这样一来，睡意就彻底跑了。把钟转向墙，手机屏幕朝下，放得离床远一点。"},{"k":"如果邻居或街上的声音吵到你","t":"用平稳的声音代替安静","b":"在完全安静里，一声关门就能把人吵醒。平稳的声音，比如雨声、电扇声，能把突然的响动抹平。大概正因为这样，在火车上听着车轮哐当声，才睡得那么香。"},{"k":"如果早上怎么也醒不过来","t":"早上去见见光，哪怕十分钟","b":"端着茶去阳台站一会儿，走路去公交站，或者坐到窗边。早晨的光会校准生物钟，到了晚上，困意会按时到来，而不是拖到凌晨两点。即使是阴天，外面也比屋里亮。"},{"k":"如果心跳得厉害，静不下来","t":"呼气比吸气长","b":"呼气比吸气长的时候，心率会慢下来。这是生理反应，没有什么魔法。试试下面的4-7-8呼吸法。如果憋气数到七有点吃力，就先从吸气4拍、呼气6拍开始。要是有点头晕，就放松地正常呼吸。"}],"tipsNote":"如果你每周有三个或更多晚上睡不好，而且持续超过三个月，这就已经是失眠了，值得去看医生。失眠可以得到很好的治疗，多数时候不用吃药，靠的是认知行为疗法。上面的建议就来自这种疗法，但医生会帮你挑出真正适合你的。","breatheTitle":"4-7-8呼吸","breatheLead":"用鼻子吸气，数4下；屏住呼吸，数7下；再用嘴慢慢呼气，数8下。一共四轮。长长的呼气能让心跳变慢，帮助身体切换到休息状态。","breatheStart":"开始","breatheStop":"停止","breatheIn":"吸气","breatheHold":"屏息","breatheOut":"呼气","breatheRound":"第{n}轮，共4轮","breatheDone":"很好。现在可以去房间了。","howTitle":"怎么用","how":[{"t":"选一个房间","b":"一共十个房间，各不相同。移动鼠标或倾斜手机，房间会微微转动。"},{"t":"安顿下来","b":"打开台灯、雨声或电视。摸摸猫，它会发出呼噜声。"},{"t":"设好定时","b":"房间会慢慢睡去：电视关掉，台灯变暗，猫睡着，声音渐渐消失，屏幕暗下来。"}],"payTitle":"喜欢的话，随心付","payLead":"这个网站免费，没有广告。如果这一夜睡得安稳，可以留下一点谢意。","footer":"静夜。献给睡不着的人。","notesTitle":"你是怎么入睡的","notesLead":"这里是网站访客分享的入睡方法，原样呈现，没有改动。如果你也有自己的办法，欢迎分享：审核后会出现在这里。","notesPh":"什么能帮你入睡？比 function mkBreath(host,onDone){
  host.innerHTML='<div class="orbBox"><div class="orb"></div><div class="orbTxt"><b></b><span></span></div></div><p class="round" aria-live="polite"></p><button class="primary"></button>';
  const orb=host.querySelector('.orb'),lb=host.querySelector('.orbTxt b'),num=host.querySelector('.orbTxt span'),rd=host.querySelector('.round'),bt=host.querySelector('button');
  const PH=[['breatheIn',4],['breatheHold',7],['breatheOut',8]],CYC=19,N=4,ease=k=>.5-.5*Math.cos(Math.PI*k);
  let run=false,t0=0,raf=0,lastPh=-1,lastRound=-1,doneTxt=false;
  const cue=ph=>{if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=[392,330,262][ph];
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025,t+.15);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+1.7)};
  function label(){bt.textContent=t(run?'home.breatheStop':'home.breatheStart');if(!run){lb.textContent='';num.textContent='';rd.textContent=doneTxt?t('home.breatheDone'):''}}
  function tick(){const e=(performance.now()-t0)/1000;if(e>=CYC*N){stop(true);return}
    const c=Math.floor(e/CYC),w=e-c*CYC;let ph=0,acc=0;while(w>=acc+PH[ph][1]){acc+=PH[ph][1];ph++}const k=(w-acc)/PH[ph][1];
    const s=ph===0?.5+.5*ease(k):ph===1?1+Math.sin(k*Math.PI*7)*.008:1-.5*ease(k);
    orb.style.transform=`scale(${s.toFixed(4)})`;
    if(ph!==lastPh){lastPh=ph;lb.textContent=t('home.'+PH[ph][0]);cue(ph)}
    num.textContent=Math.ceil(PH[ph][1]-(w-acc));if(c!==lastRound){lastRound=c;rd.textContent=t('home.breatheRound',{n:c+1})}
    raf=requestAnimationFrame(tick)}
  function start(){if(run)return;run=true;doneTxt=false;t0=performance.now();lastPh=-1;lastRound=-1;label();track('breathe',{});tick()}
  function stop(done){if(!run)return;run=false;cancelAnimationFrame(raf);orb.style.transform='scale(.5)';doneTxt=!!done;label();if(done){track('breathe',{done:1});onDone&&onDone()}}
  bt.addEventListener('click',()=>run?stop(false):start());label();

}

  applyI18n();slides.start();
  const li=lastIdx();texFor(SC[li>=0?li:0].key);
  track('session');track('home');
  geoLookup().then(cc=>{track('cc',{cc,src:GEO.src});if(!langManual){const l=pickLang(cc);if(l!==LANG){LANG=l;applyI18n()}}track('lang',{lang:LANG,manual:langManual})});
  TRK.init();if(location.hash==='#admin')adminLogin();
  setInterval(()=>{if(started&&C&&home.hidden&&!document.hidden&&TM.phase!=='asleep')track('sec',{room:C.key})},1000);
})();

/* ---------- loop ---------- */
const clock=new THREE.Clock();let tvAcc=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(!C||TM.phase==='asleep')return;
  // the home page covers the room once scrolled past the hero: no need to draw it
  if(!home.hidden&&home.scrollTop>innerHeight*.75)return;
  // timer: the room falls asleep in stages
  let night=0,vol=1;
  if(TM.on){
    TM.prog=clamp((performance.now()-TM.t0)/TM.dur,0,1);const p=TM.prog;
    if(p>.15&&S.tv){S.tv=false;sync()}if(p>.15&&S.radio){S.radio=0;AU.radio&&AU.radio(0)}
    if(p>.85&&S.lamp){S.lamp=false;sync()}
    night=sstep(.2,.9,p);vol=1-sstep(.55,1,p);
    $('#black').style.opacity=sstep(.9,1,p);
    if(p>=1){fallAsleep();return}
  }
  const dim=TM.on?1-sstep(.35,.85,TM.prog):1;
  S.lampLv=lerp(S.lampLv,(S.lamp?1:0)*dim,1-Math.exp(-dt*2.5));S.tvLv=lerp(S.tvLv,S.tv?1:0,1-Math.exp(-dt*8));S.radioLv=lerp(S.radioLv,S.radio?1:0,1-Math.exp(-dt*10));U.uLed.value.w=S.radioLv*(.9+.1*Math.sin(t*3.1));
  S.rainLv=lerp(S.rainLv,RAIN_LV[S.rain],1-Math.exp(-dt*.8));S.pet=Math.max(0,S.pet-dt*.3);
  const par=reduce?0:1-night*.7;
  if(tilt.on&&!pdown&&performance.now()-tilt.last<1500){mouse.x=tilt.x;mouse.y=tilt.y}
  const tiltLive=tilt.on&&performance.now()-tilt.last<3000;
  const idleWant=!tiltLive&&!pdown&&!document.hidden&&performance.now()-idle.last>5000?1:0;
  idle.k=lerp(idle.k,idleWant,1-Math.exp(-dt*(idleWant?.35:2)));
  let ex=mouse.x,ey=mouse.y;
  if(idle.k>.002){idle.t+=dt;ex=lerp(ex,Math.sin(idle.t*.16)*.85,idle.k);ey=lerp(ey,Math.sin(idle.t*.09+1)*.22,idle.k)}else idle.t=0;
  mouse.sx=lerp(mouse.sx,ex*par,1-Math.exp(-dt*1.6));mouse.sy=lerp(mouse.sy,ey*par,1-Math.exp(-dt*1.6));
  U.uOff.value.set(mouse.sx+Math.sin(t*.11)*.15*par,mouse.sy*.6+Math.sin(t*.17)*.08*par);
  if(C.frames){const F=FRM[C.key];if(F&&F.ready){const N=(F.n-1)/2,p=clamp(U.uOff.value.x,-1,1)*N+N,ia=Math.min(Math.floor(p),F.n-2),ib=ia+1,f=clamp(p-ia,0,1);U.tFab.value=F.fab[ia];U.tFba.value=F.fba[ia];U.uFs.value=F.fs;
    U.tImg.value=F.on[ia];U.tImgOff.value=F.off[ia];U.tOut.value=F.on[ib];U.tOutOff.value=F.off[ib];U.uFr.value=f;
    for(const [k,u] of [['cat',U.uShCat],['cup',U.uShCup],['lamp',U.uShLamp],['tv',U.uShTv]]){const a=F.sh[k][ia],b=F.sh[k][ib];u.value.set(lerp(a[0],b[0],f),lerp(a[1],b[1],f))}}}
  U.uT.value=t;U.uLamp.value=S.lampLv;U.uTV.value=S.tvLv;U.uTVfl.value=.75+Math.random()*.25;U.uPet.value=S.pet;U.uRain.value=S.rainLv;
  U.uNight.value=night;U.uExp.value=1-night*.45;
  if(C.R.tv&&S.tvLv>.02){tvAcc+=dt;if(tvAcc>.08){tvAcc=0;drawTV(t)}}
  for(const r of rip)if(r.z<99){r.z+=dt;if(r.z>3)r.z=99}
  if(C.R.pond&&Math.random()<dt*(.15+S.rainLv*6)){const a=Math.random()*Math.PI*2,k=Math.sqrt(Math.random())*.85,P=C.R.pond;addRipple(P.x+Math.cos(a)*k*P.rx,1-(P.y+Math.sin(a)*k*P.ry))}
  if(C.furin){S.nextBreeze-=dt;if(S.nextBreeze<0){S.nextBreeze=8+Math.random()*16;const k=.5+Math.random()*.7;S.furinV+=k*(Math.random()<.5?-1:1);if(AC&&vol>.2)setTimeout(()=>sfx.chime(.45*k*vol),120)}
    S.furinV+=(-S.furin*9-S.furinV*1.1)*dt;S.furin+=S.furinV*dt;U.uFurin.value=S.furin*.22+Math.sin(t*.9)*.015}
  // cat
  S.purr=Math.max(0,S.purr-dt*.08);S.lookAt=Math.max(0,S.lookAt-dt*.1);
  S.catSleep=lerp(S.catSleep,TM.on?sstep(.25,.6,TM.prog):0,1-Math.exp(-dt*.4));
  S.pu=lerp(S.pu||0,Math.max(S.purr,S.pet*.7),1-Math.exp(-dt*1.5));const pu=S.pu,sl=S.catSleep;
  S.phB=(S.phB||0)+dt*(1.3+pu*.7-sl*.5);S.phT=(S.phT||0)+dt*(.8+pu*.6);S.phW=(S.phW||0)+dt*3.1*(1+pu*.3);
  U.uPurr.value=pu;U.uBreath.value=(Math.sin(S.phB)*.5+.5)*.022*(1-sl*.3);
  let hd=Math.sin(t*.23)*.05+Math.sin(t*.61+1)*.025,nd=Math.sin(t*.37)*.25;
  if(S.lookAt>0){const k=sstep(0,.5,S.lookAt);hd=lerp(hd,-.13-.05*pu,k);nd=lerp(nd,.6,k)}
  hd=lerp(hd,.06,sl);nd=lerp(nd,1.6,sl);
  S.head=lerp(S.head,hd,1-Math.exp(-dt*2.5));S.nod=lerp(S.nod,nd,1-Math.exp(-dt*2));U.uHead.value=S.head;U.uNod.value=S.nod;
  S.nextEar-=dt;if(S.nextEar<0){S.ear=1;S.nextEar=(2.5+Math.random()*5)*(1+sl*3)}S.ear=Math.max(0,S.ear-dt*5);U.uEar.value=Math.sin(S.ear*Math.PI)*.35;
  S.tailAmp=lerp(S.tailAmp||1,1+pu*1.2,1-Math.exp(-dt*1.2));
  U.uTail.value=(Math.sin(S.phT)*.09+Math.max(0,Math.sin(t*.37))*Math.sin(S.phW)*.05*S.tailAmp)*(1-sl*.8);
  if(AC&&!switching){const realNow=S.rain>0&&((AU.rReal>>(S.rain-1))&1);if(S.rain>0)AU.usedReal=!!realNow;
    for(let i=0;i<3;i++)setA(AU.rg[i].gain,S.rain===i+1&&((AU.rReal>>i)&1)?1:0,.7);
    const synthOff=AU.usedReal;setA(AU.rainG.gain,synthOff?0:.16*S.rainLv);setA(AU.rainH.gain,synthOff?0:.05*Math.max(0,(S.rainLv-.45)/.55));
    const calmB=TM.on?1-TM.prog*.6:1;for(const nm in AU.bedGs){const b=AU.beds.find(x=>x[0]===nm);setA(AU.bedGs[nm].gain,b?b[1]*(nm==='night1'||nm==='night2'||nm==='katydid'?1-.6*S.rainLv:1)*calmB:0,.8)}if(AU.purrR){setA(AU.purrR.gain,pu);setA(AU.purrG.gain,0)}else setA(AU.purrG.gain,pu*1.7);setA(AU.tvG.gain,.012*S.tvLv);setA(AU.radG.gain,.34*(S.radio?1:0)*calmB);setA(AU.radHiss.gain,.006*(S.radio?1:0)*calmB);setA(AU.tvHum.gain,.004*S.tvLv);
    setA(master.gain,muted?0:.9*vol,.4)}
  renderer.render(scene,cam);
}
frame();
})();

</script>
